name: Sync to Client Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push to client repository
        env:
          CLIENT_GITHUB_TOKEN: ${{ secrets.CLIENT_GITHUB_TOKEN }}
          CLIENT_REPO: masoubalqarya/masoub-alqariyah-website
        run: |
          set -euo pipefail

          if [ -z "${CLIENT_GITHUB_TOKEN}" ]; then
            echo "::error::CLIENT_GITHUB_TOKEN secret is not set in this repository."
            exit 1
          fi

          git remote add client "https://x-access-token:${CLIENT_GITHUB_TOKEN}@github.com/${CLIENT_REPO}.git"

          # Checkout leaves a detached HEAD; push the checked-out commit to client main.
          git push client HEAD:refs/heads/main --force
